<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attribute and nth child pesudio code</title>
    <style>
      .container {
        display: block;
        width: 250px;
        margin: auto;
      }
      input {
        display: block;
      }
      input[type="text"] {
        padding: 12px;
        border: 2px solid aqua;
      }
      a[target] {
        font-size: 46px;
        color: teal;
        text-decoration: none;
      }
      a[target="_self"] {
        font-size: 46px;
        color: rgb(115, 128, 0);
        text-decoration: none;
      }
      li:nth-child(3) {
        color: rgb(176, 17, 5);
      }
      li:nth-child(2n + 0) {
        color: blueviolet;
      }
      li:nth-child(odd) {
        background-color: turquoise;
      }
      li:nth-child(even) {
        background-color: palevioletred;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1><a href="http://google.com" target="_blank">Google</a></h1>
      <h1><a href="http://facebook.com" target="_self">Facebook</a></h1>
      <form action="" class="form-control">
        <input type="text" placeholder="Enter your name" />
        <input type="password" placeholder="Enter your Password" />
        <input type="submit" value="submit" />
      </form>
      <ul>
        <li class="item" id="item-1">item1</li>
        <li class="item" id="item-2">item2</li>
        <li class="item" id="item-3">item3</li>
        <li class="item" id="item-4">item4</li>
        <li class="item" id="item-5">item5</li>
        <li class="item" id="item-6">item6</li>
        <li class="item" id="item-7">item7</li>
        <li class="item" id="item-8">item8</li>
        <li class="item" id="item-9">item9</li>
        <li class="item" id="item-10">item10</li>
      </ul>
    </div>
  </body>
</html>
