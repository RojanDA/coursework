<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyframes and container</title>
    <style>
      .container {
        background-color: aqua;
      }
      .box {
        background-color: blueviolet;
        width: 250px;
        height: 250px;
        position: relative;
        animation-name: rojan1;
        animation-name: rojan;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        animation-fill-mode: alternative;
        animation-timing-function: ease-in-out;
        animation-delay: 2s;
        /* animation-direction: reverse; */
        /* below given animation properties can be set using this shorthand  */
        /*  animation: animation-name animation-duration animation-timing-function animation-delay 
       animation-iteration-count animation-fill-mode; */
        /* eg */
        animation: rojan 5s ease-in 1s 12 backwards;
      }
      @keyframes rojan {
        0% {
          top: 0px;
          left: 0px;
        }
        25% {
          top: 250px;
          left: 0px;
        }
        50% {
          top: 250px;
          left: 250px;
        }
        75% {
          top: 0px;
          left: 250px;
        }
        100% {
          top: 0px;
          left: 0px;
        }
      }
      @keyframes rojan1 {
        from {
          width: 200px;
        }
        to {
          width: 1500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">This is a box</div>
    </div>
  </body>
</html>
