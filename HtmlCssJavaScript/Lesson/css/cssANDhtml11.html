<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      /* position: static(defult), absolute,relative,fixed,sticky */
      .box {
        display: inline-block;
        border: 2px solid red;
        width: 150px;
        height: 150px;
        margin: 2px;
      }
      #box3 {
        /* relative: relative to its normal position  and will leave a gap at its nor mal position*/
        /* position: relative; */
        /* absolute: relative to its position of its first parent
         position: absolute; */
        /* fixed: relative tot the browser window; */
        /* position: fixed;
         right: 4px;
         bottom: 2px; */
        /* sticky */
        position: sticky;
      }
    </style>
  </head>
  <body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
  </body>
</html>
