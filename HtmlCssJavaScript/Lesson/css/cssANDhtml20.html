<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Variables/Custom properties</title>
    <style>
      :root {
        --primary-color: black;
        --max-width: 400px;
      }
      .box {
        --box-color: blue;
        width: 200px;
        height: 200px;
        background-color: var(--box-color);
        border: 2px solid rgb(255, 0, 0);
        margin: 2px 9px;
        box-shadow: 3px 3px var(--box-color);
      }
      .container {
        display: flex;
        margin: auto;
        background-color: var(--primary-color);
        align-items: center;
        justify-content: center;
        width: var(--max-width);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
