<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visibility and z-index</title>
    <style>
      .box {
        width: 170px;
        height: 170px;
        border: 2px solid black;
      }
      #box1 {
        position: relative;
        top: 39px;
        /* z-index: 35;--- it will position the box or element which should be at top or botton */
        background-color: aqua;
      }
      #box2 {
        position: relative;
        top: 14px;
        /* diplay:none;--- will hide the element and also remove the space that element is taking */
        /* visibility: hidden; --- it will ide the element but it will not remove the space it taking */
        background-color: skyblue;
      }
      #box3 {
        background-color: lightblue;
      }
      #box4 {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
  </body>
</html>
