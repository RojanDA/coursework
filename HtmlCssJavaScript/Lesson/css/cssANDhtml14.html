<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>size unit</title>
    <style>
      .container {
        font-size: 15px;
        border: 2px solid red;
        width: 100vw;
        height: 100vh;
      }
      h2 {
        text-align: center;
      }
      #first {
        font-size: 2em; /*if we use em then it will multiply the font-sixe of the parent*/
        padding: 2em; /*in case of padding ang margine it eill multiply with thw font-size of the element*/
      }
      #seconmd {
        font-size: 3rem; /* it will change the intire document font i mean yadi hamiley html ko font 15px 
            rakhim vaney yo tiyo font anusar change hunxa 
            asko connection intire document sagahunxa*/
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 id="first">This is 1st heading</h2>
      <h2 id="second">This is 2nd heading</h2>
      <h2 id="third">This is 3rd heading</h2>
    </div>
  </body>
</html>
