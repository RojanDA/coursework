<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Font</title>
    <style>
      p {
        font-family: "Gill Sans", "Gill Sans MT", "Trebuchet MS", sans-serif;
        font-size: 22px; /*1/96th of inch */
        line-height: 1em; /* used for spacing in the paragraoph */
        font-weight: bold; /* for making task bold*/
      }
      span {
        font-size: 24px;
        color: aqua;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h2>CSS Font</h2>
    <p>lets play with <span>font</span></p>
  </body>
</html>
