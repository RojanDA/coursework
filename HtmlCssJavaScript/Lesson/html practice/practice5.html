<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ids and classes</title>
  </head>
  <body>
    <h2>Ids and classes</h2>
    <dev id="mainbox" class="redbg"> rojan chandra poudel</dev>
    <!-- Emmet -->
    <span class="redbg"></span>
    <span id="mainspan"></span>
    <div class="redbg blackborder"></div>
    <!-- . is for class and # is for id -->
    <!-- eg: div.redbg.blackborder will make a div and put class but if we use # then id will be created -->
    <!-- Emmet takes div tag as defult if we just press .redbg.blackborder -->

    <!-- creating multiple element using Emmet -->
    <!-- span.class1.class2.class3 + <tab> -->
    <span class="class1 class2 class3">first</span>
    <span class="class1 class2 class3">secomd</span>
    <span class="class1 class2 class3">third</span>
    <span class="class1 class2 class3">fourth</span>
  </body>
</html>
