<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogIn Page</title>
  </head>
  <body>
    <h1>Create Login ID</h1>
    <form action="practice1.html">
      <div>
        <label for="Username">Username</label><br /><input
          type="text"
          name="username"
          id="Username"
        />
      </div>
      <br />
      <div>
        <label for="Password">Password</label><br /><input
          type="Password"
          name="myPassword"
          id="Password"
        />
      </div>
      <br />
      <div>
        <label for="Name">Full_Name</label><br /><input
          type="text"
          name="Myname"
          id="Name"
        />
      </div>
      <br />
      <div>
        <label for="Date">Date of birth</label><br /><input
          type="date"
          name="date of birth"
          id="Date"
        />
      </div>
      <br />
      <div>
        <label for="Email">Email</label><br /><input
          type="email"
          name="email"
          id="Email"
        />
      </div>
      <br />
      <div>
        <label for="Telephone">Telephone</label><br /><input
          type="number"
          name="contact"
          id="Telephone"
        />
      </div>
      <br />
      <div>
        <label for="Address">Address</label><br /><input
          type="text"
          name="address"
          id="Address"
        />
      </div>
      <br />
      <div>
        <label for="Current_Address">Current_Address</label><br /><input
          type="text"
          name="CurrentAddress"
          id="Current_Address"
        />
      </div>
      <br />
      <div>
        Gender: Male<input type="radio" name="gender" /> Female<input
          type="radio"
          name="gender"
        />
        Other<input type="radio" name="gender" />
      </div>
      <br />
      <div>Are you 18+:<input type="checkbox" name="check" /></div>
      <br />
      <div>
        About yourself<br /><textarea
          name="introduction"
          cols="30"
          rows="2"
        ></textarea>
      </div>
      <br />
      <div>
        <label for="Qualification">Qualification</label>
        <select name="Qualification" id="Qualification">
          <option value="SEE">SEE</option>
          <option value="+2">+2</option>
          <option value="Bechalor">Bechalor</option>
        </select>
      </div>
      <br />
      <div>
        <input type="submit" name="submit" />
        <input type="reset" name="reset" />
      </div>
    </form>
  </body>
</html>
