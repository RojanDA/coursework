<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript dates</title>
  </head>
  <body>
    <div class="container">
      This is a container. <br />
      <span id="time"></span>
    </div>

    <script>
      console.log("This is date and time tutorial");
      let now = new Date();
      console.log(now);

      //   let dt = new Date("2023-09-21");
      //   console.log(dt);
      //   let dt = new Date(year, month,date,hour, minutes, seconds, milliseconds);

      let newDate = new Date(2024, 08, 21, 9, 45, 32, 67);
      console.log(newDate);

      let yearr = newDate.getFullYear();
      console.log("the year is ", yearr);

      let date = newDate.getDate();
      console.log("the date is ", date);

      let mn = newDate.getMonth();
      console.log("the month is ", mn);

      let hours = newDate.getHours();
      console.log("the hours is ", hours);

      newDate.setDate(37);
      newDate.setMinutes(69);
      console.log(newDate);
      setInterval(updateTime, 1000);

      function updateTime() {
        time.innerHTML = new Date();
      }
    </script>
  </body>
</html>
